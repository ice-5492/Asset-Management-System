<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการเบิกอะไหล่/อุปกรณ์</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f3f4f6;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen pb-10">

    <!-- Navbar Header -->
    <header class="bg-blue-600 text-white shadow-lg mb-6">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
            <h1 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-boxes-packing"></i>
                ระบบบันทึกการเบิกอะไหล่ / อุปกรณ์
            </h1>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 space-y-6">

        <!-- ฟอร์มบันทึกข้อมูล -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-lg font-bold text-gray-800 border-b pb-2 mb-4 flex items-center gap-2">
                <i class="fa-solid fa-pen-to-square text-blue-600"></i>
                แบบฟอร์มบันทึกการเบิก
            </h2>

            <form id="recordForm" onsubmit="submitForm(event)" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                
                <!-- 1. วันที่ -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        วันที่ทำรายการ <span class="text-red-500">*</span>
                    </label>
                    <input type="date" id="date" required 
                           class="w-full border border-gray-300 rounded-md p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- 2. ชื่อช่างผู้เบิก -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        ชื่อช่างผู้เบิก <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="name" placeholder="เช่น นายภาณุวิชญ์ หนูเทศ" required 
                           class="w-full border border-gray-300 rounded-md p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- 3. รายการอุปกรณ์ -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        รายการอุปกรณ์ / อะไหล่ <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="item" placeholder="ระบุชื่อสายหรืออุปกรณ์" required 
                           class="w-full border border-gray-300 rounded-md p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- 4. หมายเลขครุภัณฑ์ (รองรับ Autocomplete จาก AllowedSerials) -->
                <div class="relative">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        หมายเลขครุภัณฑ์ <span class="text-red-500">*</span>
                    </label>
                    <input type="text" id="serial" placeholder="เช่น 6695-033-213" required autocomplete="off"
                           oninput="onSerialInput(this.value)"
                           class="w-full border border-gray-300 rounded-md p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    
                    <!-- Dropdown เสนอแนะครุภัณฑ์ -->
                    <div id="serialSuggestions" class="hidden absolute z-10 w-full bg-white border border-gray-300 rounded-md shadow-lg max-h-48 overflow-y-auto mt-1"></div>
                </div>

                <!-- 5. จำนวน -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        จำนวน <span class="text-red-500">*</span>
                    </label>
                    <input type="number" id="qty" value="1" min="1" required 
                           class="w-full border border-gray-300 rounded-md p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- 6. เลขที่ใบส่งซ่อม -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold text-gray-700 mb-1">
                        เลขที่ใบส่งซ่อม
                    </label>
                    <input type="text" id="repairNo" placeholder="เช่น 32210/2569" 
                           class="w-full border border-gray-300 rounded-md p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
                </div>

                <!-- ปุ่มส่งข้อมูล -->
                <div class="md:col-span-2 mt-2">
                    <button type="submit" id="submitBtn" 
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md shadow transition duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-paper-plane"></i>
                        บันทึกข้อมูล
                    </button>
                </div>

            </form>
        </div>

        <!-- ตารางประวัติการเบิกล่าสุด -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4 border-b pb-3">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-blue-600"></i>
                    ประวัติการเบิกอุปกรณ์ล่าสุด
                </h2>
                <!-- ช่องค้นหาในตาราง -->
                <div class="relative w-full md:w-64">
                    <input type="text" id="searchTable" onkeyup="filterTable()" placeholder="ค้นหาครุภัณฑ์/รายการ..." 
                           class="w-full border border-gray-300 rounded-md pl-9 pr-3 py-1.5 text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-gray-400 text-sm"></i>
                </div>
            </div>

            <!-- โหลดดิ้งสถานะ -->
            <div id="loadingState" class="text-center py-8 text-gray-500">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl text-blue-600 mb-2"></i>
                <p>กำลังโหลดข้อมูลประวัติ...</p>
            </div>

            <!-- ตารางแสดงรายการ -->
            <div class="overflow-x-auto">
                <table id="historyTable" class="hidden w-full text-left border-collapse min-w-[650px]">
                    <thead>
                        <tr class="bg-gray-100 text-gray-700 text-sm border-b">
                            <th class="p-3">วันที่</th>
                            <th class="p-3">รายการ</th>
                            <th class="p-3">หมายเลขครุภัณฑ์</th>
                            <th class="p-3 text-center">จำนวน</th>
                            <th class="p-3">ชื่อช่าง</th>
                            <th class="p-3">เลขที่ใบส่งซ่อม</th>
                        </tr>
                    </thead>
                    <tbody id="historyTbody" class="divide-y divide-gray-200 text-sm">
                        <!-- รายการประวัติจะถูกสร้างผ่าน JS -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // Web App URL จาก Google Apps Script ของคุณ
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyVGfjwAEltKEiTFwIPHQTGCWic82Ujj3vfkmYkGHHHa_fdddO2kJMONgLSPnqNN1Ornw/exec";

        let allowedSerialsList = [];
        let globalHistoryData = [];

        // ตั้งค่าวันที่ปัจจุบันเป็น default
        document.addEventListener("DOMContentLoaded", () => {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("date").value = today;
            loadData();
        });

        // ฟังก์ชันล้างอักขระพิเศษสำหรับเปรียบเทียบ Serial
        function cleanStr(val) {
            return String(val || "").trim().toLowerCase().replace(/[\s\-_()]/g, '');
        }

        // 1. โหลดข้อมูลจาก Google Apps Script
        async function loadData() {
            const loading = document.getElementById("loadingState");
            const table = document.getElementById("historyTable");
            
            try {
                const response = await fetch(GOOGLE_SCRIPT_URL);
                const data = await response.json();
                
                allowedSerialsList = data.allowedSerials || [];
                globalHistoryData = data.history || [];

                renderTable(globalHistoryData);

                loading.classList.add("hidden");
                table.classList.remove("hidden");
            } catch (err) {
                console.error(err);
                loading.innerHTML = `<p class="text-red-500"><i class="fa-solid fa-triangle-exclamation"></i> ไม่สามารถโหลดข้อมูลได้ โปรดลองอีกครั้ง</p>`;
            }
        }

        // Render ตารางข้อมูล
        function renderTable(dataItems) {
            const tbody = document.getElementById("historyTbody");
            tbody.innerHTML = "";

            if (dataItems.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-gray-400">ยังไม่มีประวัติการเบิก</td></tr>`;
                return;
            }

            // แสดงรายการล่าสุดขึ้นก่อน
            const reversedData = [...dataItems].reverse();

            reversedData.forEach(row => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-gray-50 transition";
                tr.innerHTML = `
                    <td class="p-3 text-gray-600 font-medium">${row.date || '-'}</td>
                    <td class="p-3 text-gray-800">${row.item || '-'}</td>
                    <td class="p-3"><span class="bg-blue-50 text-blue-700 px-2 py-1 rounded text-xs font-semibold">${row.serial || '-'}</span></td>
                    <td class="p-3 text-center">${row.qty || '1'}</td>
                    <td class="p-3 text-gray-700">${row.name || '-'}</td>
                    <td class="p-3 text-gray-500">${row.repairNo || '-'}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ระบบค้นหาในตาราง
        function filterTable() {
            const keyword = document.getElementById("searchTable").value.toLowerCase();
            const filtered = globalHistoryData.filter(item => {
                return (item.item && item.item.toLowerCase().includes(keyword)) ||
                       (item.serial && item.serial.toLowerCase().includes(keyword)) ||
                       (item.name && item.name.toLowerCase().includes(keyword)) ||
                       (item.repairNo && item.repairNo.toLowerCase().includes(keyword));
            });
            renderTable(filtered);
        }

        // 2. ระบบ Autocomplete ช่องค้นหาครุภัณฑ์
        function onSerialInput(val) {
            const suggestionsEl = document.getElementById("serialSuggestions");
            const cleanVal = cleanStr(val);

            if (!cleanVal || allowedSerialsList.length === 0) {
                suggestionsEl.innerHTML = "";
                suggestionsEl.classList.add("hidden");
                return;
            }

            const matches = allowedSerialsList.filter(s => cleanStr(s).includes(cleanVal)).slice(0, 10);

            if (matches.length === 0) {
                suggestionsEl.innerHTML = "";
                suggestionsEl.classList.add("hidden");
                return;
            }

            suggestionsEl.innerHTML = matches.map(s => `
                <div onclick="selectSerial('${s}')" class="p-2 hover:bg-blue-50 cursor-pointer text-sm text-gray-700 border-b border-gray-100">
                    ${s}
                </div>
            `).join('');

            suggestionsEl.classList.remove("hidden");
        }

        function selectSerial(val) {
            document.getElementById("serial").value = val;
            document.getElementById("serialSuggestions").classList.add("hidden");
        }

        // ปิด Autocomplete เมื่อคลิกนอกพื้นที่
        document.addEventListener("click", (e) => {
            const suggestionsEl = document.getElementById("serialSuggestions");
            if (!e.target.closest("#serial") && !e.target.closest("#serialSuggestions")) {
                suggestionsEl.classList.add("hidden");
            }
        });

        // 3. ฟังก์ชันบันทึกข้อมูล (Submit Form)
        async function submitForm(event) {
            event.preventDefault();

            const submitBtn = document.getElementById("submitBtn");
            const dateVal = document.getElementById("date").value;
            const nameVal = document.getElementById("name").value.trim();
            const itemVal = document.getElementById("item").value.trim();
            const serialVal = document.getElementById("serial").value.trim();
            const qtyVal = document.getElementById("qty").value;
            const repairNoVal = document.getElementById("repairNo").value.trim();

            const inputSerialClean = cleanStr(serialVal);

            // ตรวจสอบความถูกต้องเบื้องต้นก่อนส่ง (Frontend Validation)
            if (allowedSerialsList.length > 0) {
                const isAllowed = allowedSerialsList.some(s => cleanStr(s) === inputSerialClean);
                if (!isAllowed) {
                    Swal.fire({
                        icon: 'error',
                        title: 'หมายเลขครุภัณฑ์ไม่ถูกต้อง',
                        text: 'หมายเลขครุภัณฑ์นี้ไม่ได้อยู่ในรายการที่ได้รับอนุญาต (291 เครื่อง)',
                        confirmButtonColor: '#2563eb'
                    });
                    return;
                }
            }

            // แสดงสถานะกำลังบันทึก
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังบันทึกข้อมูล...`;

            try {
                // ส่งข้อมูลในรูปแบบ URL Search Params เพื่อป้องกันติด CORS ของ Apps Script
                const formData = new URLSearchParams();
                formData.append("date", dateVal);
                formData.append("name", nameVal);
                formData.append("item", itemVal);
                formData.append("serial", serialVal);
                formData.append("qty", qtyVal);
                formData.append("repairNo", repairNoVal);

                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded"
                    },
                    body: formData.toString()
                });

                const result = await response.json();

                if (result.result === "success") {
                    Swal.fire({
                        icon: 'success',
                        title: 'บันทึกสำเร็จ!',
                        text: 'บันทึกข้อมูลการเบิกเรียบร้อยแล้ว',
                        timer: 2000,
                        showConfirmButton: false
                    });

                    // ล้างฟอร์ม
                    document.getElementById("item").value = "";
                    document.getElementById("serial").value = "";
                    document.getElementById("qty").value = "1";
                    document.getElementById("repairNo").value = "";

                    // รีโหลดตาราง
                    loadData();
                } else if (result.message && result.message.includes("Duplicate serial within 365 days")) {
                    Swal.fire({
                        icon: 'warning',
                        title: 'ไม่สามารถเบิกได้',
                        text: 'หมายเลขครุภัณฑ์นี้เคยถูกเบิกไปแล้วภายใน 365 วันที่ผ่านมา',
                        confirmButtonColor: '#2563eb'
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'เกิดข้อผิดพลาด',
                        text: result.message || 'ไม่สามารถบันทึกข้อมูลได้',
                        confirmButtonColor: '#2563eb'
                    });
                }

            } catch (err) {
                console.error(err);
                Swal.fire({
                    icon: 'error',
                    title: 'เชื่อมต่อล้มเหลว',
                    text: 'เกิดปัญหาในการเชื่อมต่อกับเซิร์ฟเวอร์ โปรดลองใหม่อีกครั้ง',
                    confirmButtonColor: '#2563eb'
                });
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-paper-plane"></i> บันทึกข้อมูล`;
            }
        }
    </script>
</body>
</html>
