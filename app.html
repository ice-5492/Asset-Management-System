<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการวัสดุแพทย์ออนไลน์ & Dashboard</title>
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .app-container { max-width: 950px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); overflow: hidden; }
        .tabs { display: flex; background: #005088; }
        .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: #fff; font-size: 16px; cursor: pointer; transition: 0.3s; font-weight: bold; }
        .tab-btn.active { background: #11CAA0; color: #000; }
        .content { padding: 30px; display: none; }
        .content.active { display: block; }
        h2 { color: #005088; margin-top: 0; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .btn-main { width: 100%; padding: 15px; background: #005088; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        .btn-main:hover { background: #003d66; }
        .btn-main:disabled { background: #ccc; cursor: not-allowed; }
        .dashboard-card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 20px; border-radius: 10px; margin-top: 20px; }
        .stat-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #ddd; }
        .stat-name { flex: 1; color: #333; }
        .stat-value { font-weight: bold; color: #11CAA0; font-size: 18px; width: 100px; text-align: right; }
        .chart-bar-bg { flex: 0 0 150px; background: #ddd; height: 10px; border-radius: 5px; margin: 0 15px; overflow: hidden; }
        .chart-bar-fill { background: #11CAA0; height: 100%; }
        .loading { text-align: center; color: #666; font-style: italic; }
        .filter-toggle { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-toggle { flex: 1; padding: 10px; background: #e2e8f0; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-toggle.active { background: #005088; color: white; }
        .sub-section { margin-top: 25px; padding-top: 15px; border-top: 2px dashed #e2e8f0; }
        .error-text { color: red; font-size: 14px; margin-top: 5px; display: none; font-weight: bold; }
        .valid-text { color: green; font-size: 14px; margin-top: 5px; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('record')">📝 บันทึกการใช้ของ (User)</button>
        <button class="tab-btn" onclick="switchTab('dashboard')">📊 Dashboard สรุปผล (Admin)</button>
    </div>

    <!-- หน้าบันทึกข้อมูล -->
    <div id="record" class="content active">
        <h2>บันทึกความต้องการวัสดุ</h2>
        <div class="form-group">
            <label>👤 เลือกชื่อผู้ต้องการสินค้า / ผู้บันทึก:</label>
            <select id="inputName">
                <option value="" disabled selected>--- กรุณาเลือกชื่อของคุณ ---</option>
                <option value="นายไกรพล ภักดีภูวนารถ">1. นายไกรพล ภักดีภูวนารถ</option>
                <option value="นายณัฐฎ์วัฒน์ นิ่มพานิชย์">2. นายณัฐฎ์วัฒน์ นิ่มพานิชย์</option>
                <option value="นายพิวา ราชเพียแก้ว">3. นายพิวา ราชเพียแก้ว</option>
                <option value="นายยศพนธ์ คันธนู">4. นายยศพนธ์ คันธนู</option>
                <option value="นายปัญญา สมตระกูล">5. นายปัญญา สมตระกูล</option>
                <option value="นายภาณุวิชญ์ หนูเทศ">6. นายภาณุวิชญ์ หนูเทศ</option>
                <option value="นายธีธัช เล็กอุทัย">7. นายธีธัช เล็กอุทัย</option>
            </select>
        </div>
        <div class="form-group">
            <label>📅 เลือกวันที่ต้องการใช้ (ปฏิทิน):</label>
            <input type="date" id="inputDate" onchange="validateSerialInput()">
        </div>
        <div class="form-group">
            <label>📦 เลือกรายการวัสดุ (17 รายการ):</label>
            <select id="inputItem">
                <option value="สายวัดความเข้มข้นของออกซิเจนในเลือด (SpO2 Sensor) แบบหนีบนิ้ว 6-PIN (สำหรับเครื่อง ยี่ห้อ EDAN, Mindray)">สายวัดความเข้มข้นของออกซิเจนในเลือด (SpO2 Sensor) แบบหนีบนิ้ว 6-PIN (สำหรับเครื่อง ยี่ห้อ EDAN, Mindray)</option>
                <option value="สายวัดความเข้มข้นของออกซิเจนในเลือด (SpO2 Sensor) แบบหนีบนิ้ว 7-PIN (สำหรับเครื่อง ยี่ห้อ Mindray)">สายวัดความเข้มข้นของออกซิเจนในเลือด (SpO2 Sensor) แบบหนีบนิ้ว 7-PIN (สำหรับเครื่อง ยี่ห้อ Mindray)</option>
                <option value="สายวัดความเข้มข้นของออกซิเจนในเลือด (SpO2 Sensor) แบบหนีบนิ้ว 8-PIN (สำหรับเครื่อง ยี่ห้อ PHILIPS, Philips Goldway)">สายวัดความเข้มข้นของออกซิเจนในเลือด (SpO2 Sensor) แบบหนีบนิ้ว 8-PIN (สำหรับเครื่อง ยี่ห้อ PHILIPS, Philips Goldway)</option>
                <option value="สายวัดความเข้มข้นของออกซิเจนในเลือด (SpO2 Sensor) แบบสวมนิ้ว 8-PIN (สำหรับเครื่อง ยี่ห้อ Philips, Philips Goldway)">สายวัดความเข้มข้นของออกซิเจนในเลือด (SpO2 Sensor) แบบสวมนิ้ว 8-PIN (สำหรับเครื่อง ยี่ห้อ Philips, Philips Goldway)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (3 Lead ECG Cable) แบบกระดุม 12-PIN (สำหรับเครื่อง ยี่ห้อ Philips Goldway)">สายวัดคลื่นไฟฟ้าหัวใจ (3 Lead ECG Cable) แบบกระดุม 12-PIN (สำหรับเครื่อง ยี่ห้อ Philips Goldway)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (3 Lead ECG Cable) แบบหนีบ 12-PIN (สำหรับเครื่อง ยี่ห้อ PHILIPS)">สายวัดคลื่นไฟฟ้าหัวใจ (3 Lead ECG Cable) แบบหนีบ 12-PIN (สำหรับเครื่อง ยี่ห้อ PHILIPS)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบกระดุม 6-PIN (สำหรับเครื่อง ยี่ห้อ EDAN)">สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบกระดุม 6-PIN (สำหรับเครื่อง ยี่ห้อ EDAN)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบหนีบ 6-PIN (สำหรับเครื่อง ยี่ห้อ Mindray)">สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบหนีบ 6-PIN (สำหรับเครื่อง ยี่ห้อ Mindray)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบกระดุม 12-PIN (สำหรับเครื่อง ยี่ห้อ Mindray, Philips)">สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบกระดุม 12-PIN (สำหรับเครื่อง ยี่ห้อ Mindray, Philips)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบกระดุม 12-PIN (สำหรับเครื่อง ยี่ห้อ Mindray)">สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบกระดุม 12-PIN (สำหรับเครื่อง ยี่ห้อ Mindray)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบกระดุม 12-PIN (สำหรับเครื่อง ยี่ห้อ Philips)">สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบกระดุม 12-PIN (สำหรับเครื่อง ยี่ห้อ Philips)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบหนีบ 12-PIN (สำหรับเครื่อง ยี่ห้อ Mindray)">สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบหนีบ 12-PIN (สำหรับเครื่อง ยี่ห้อ Mindray)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบหนีบ 12-PIN (สำหรับเครื่อง ยี่ห้อ Philips)">สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบหนีบ 12-PIN (สำหรับเครื่อง ยี่ห้อ Philips)</option>
                <option value="สายวัดความเข้มข้นของออกซิเจนในเลือด (SpO2 Sensor) แบบสวมนิ้ว 8-PIN สายแท้ (สำหรับเครื่อง ยี่ห้อ Philips)">สายวัดความเข้มข้นของออกซิเจนในเลือด (SpO2 Sensor) แบบสวมนิ้ว 8-PIN สายแท้ (สำหรับเครื่อง ยี่ห้อ Philips)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (3 Lead ECG Cable) แบบหนีบ 12-PIN สายแท้ (สำหรับเครื่อง ยี่ห้อ Philips)">สายวัดคลื่นไฟฟ้าหัวใจ (3 Lead ECG Cable) แบบหนีบ 12-PIN สายแท้ (สำหรับเครื่อง ยี่ห้อ Philips)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบกระดุม 12-PIN สายแท้ (สำหรับเครื่อง ยี่ห้อ Philips)">สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบกระดุม 12-PIN สายแท้ (สำหรับเครื่อง ยี่ห้อ Philips)</option>
                <option value="สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบหนีบ 12-PIN สายแท้ (สำหรับเครื่อง ยี่ห้อ Philips)">สายวัดคลื่นไฟฟ้าหัวใจ (5 Lead ECG Cable) แบบหนีบ 12-PIN สายแท้ (สำหรับเครื่อง ยี่ห้อ Philips)</option>
            </select>
        </div>

        <!-- ช่องคีย์หมายเลขครุภัณฑ์ -->
        <div class="form-group">
            <label>🆔 คีย์หมายเลขครุภัณฑ์ (ระบบจะตรวจสอบจากฐานข้อมูล 291 เครื่อง):</label>
            <input type="text" id="inputSerial" placeholder="กรุณากรอกหมายเลขครุภัณฑ์ เช่น 66695-033-138" oninput="validateSerialInput()">
            <div id="serialError" class="error-text"></div>
            <div id="serialValid" class="valid-text">✅ หมายเลขครุภัณฑ์ถูกต้อง และสามารถเบิกได้</div>
        </div>

        <div class="form-group">
            <label>🔢 จำนวนที่ต้องใช้ (เครื่อง/ชิ้น):</label>
            <input type="number" id="inputQty" placeholder="ระบุจำนวน" min="1" value="1">
        </div>
        <button class="btn-main" id="btnSubmit" onclick="saveDataOnline()">ส่งข้อมูลเข้าสู่ระบบกลาง</button>
        <p id="saveMsg" style="text-align: center; font-weight: bold; display: none;"></p>
    </div>

    <!-- หน้า Dashboard -->
    <div id="dashboard" class="content">
        <h2>Dashboard สรุปยอดรวมออนไลน์</h2>
        <div id="dashboardResult" class="dashboard-card">
            <p style="text-align: center; color: #888;">กำลังโหลดฐานข้อมูลกลาง...</p>
        </div>
    </div>
</div>

<script>
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwEz8c-8yl8icdRe56B9lMQq_fQGvpnWG9b6-V2ZSrbuu6F-o2Vq6UwO6gmh8vvLalFKw/exec";
    
    let historyRecords = [];     // ประวัติการเบิก (ชีตแรก)
    let validAssetSerials = [];  // รายการครุภัณฑ์ที่ถูกต้อง 291 เครื่อง (ชีตสอง)

    document.getElementById('inputDate').valueAsDate = new Date();

    // ดึงข้อมูลฐานข้อมูลเริ่มต้นครั้งแรก
    fetchDatabase();

    function fetchDatabase() {
        fetch(GOOGLE_SCRIPT_URL)
        .then(res => res.json())
        .then(data => {
            // โค้ดหลังบ้านที่ส่งกลับมา จะส่งเป็น Object ที่แยกประวัติ และรายการครุภัณฑ์ให้
            historyRecords = data.history || [];
            validAssetSerials = data.validSerials || [];
            
            // กรณีโค้ดเก่าส่งมาเฉพาะอาเรย์ปกติ ให้แปลงข้อมูลรองรับไว้ก่อน
            if(Array.isArray(data) && data.length > 0 && !data[0].hasOwnProperty('validSerials')){
                historyRecords = data;
            }
        })
        .catch(err => console.error("Error fetching database: ", err));
    }

    // ฟังก์ชันการตรวจสอบเลขครุภัณฑ์หลัก
    function validateSerialInput() {
        const serialInput = document.getElementById('inputSerial').value.trim().toLowerCase();
        const inputDateStr = document.getElementById('inputDate').value;
        const errorText = document.getElementById('serialError');
        const validText = document.getElementById('serialValid');
        const btn = document.getElementById('btnSubmit');

        if (serialInput === "" || !inputDateStr) {
            errorText.style.display = 'none';
            validText.style.display = 'none';
            btn.disabled = false;
            return;
        }

        // เงื่อนไขที่ 1: ตรวจเช็คว่าเลขที่พิมพ์ อยู่ในกลุ่มเลขครุภัณฑ์ 291 เครื่องหรือไม่ (ถ้าข้อมูลในชีตสองโหลดมาแล้ว)
        if(validAssetSerials.length > 0) {
            const isExistInMaster = validAssetSerials.some(s => String(s).trim().toLowerCase() === serialInput);
            if(!isExistInMaster) {
                errorText.style.display = 'block';
                validText.style.display = 'none';
                errorText.innerText = "❌ ไม่พบหมายเลขครุภัณฑ์นี้ในระบบ (กรุณาตรวจสอบการสะกดคำ)";
                btn.disabled = true;
                return;
            }
        }

        // เงื่อนไขที่ 2: ตรวจเช็คการเบิกซ้ำภายใน 1 ปี (365 วัน)
        const inputTime = new Date(inputDateStr).getTime();
        const oneYearInMs = 365 * 24 * 60 * 60 * 1000;

        const hasConflict = historyRecords.some(record => {
            if (!record.serial || !record.date) return false;
            const dbSerial = String(record.serial).trim().toLowerCase();
            if (dbSerial !== serialInput) return false;

            const dbTime = new Date(record.date).getTime();
            const timeDiff = Math.abs(inputTime - dbTime);
            return timeDiff < oneYearInMs;
        });

        if (hasConflict) {
            errorText.style.display = 'block';
            validText.style.display = 'none';
            errorText.innerText = "❌ หมายเลขครุภัณฑ์นี้เพิ่งถูกใช้งานไปไม่ถึง 1 ปี! ไม่สามารถเบิกซ้ำได้";
            btn.disabled = true;
        } else {
            errorText.style.display = 'none';
            validText.style.display = 'block';
            btn.disabled = false;
        }
    }

    function switchTab(tabId) {
        document.querySelectorAll('.content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        if (window.event && window.event.currentTarget) {
            window.event.currentTarget.classList.add('active');
        }
        if(tabId === 'dashboard') loadDashboardOnline();
    }

    function saveDataOnline() {
        const nameSelect = document.getElementById('inputName');
        const name = nameSelect.value;
        const date = document.getElementById('inputDate').value;
        const item = document.getElementById('inputItem').value;
        const serial = document.getElementById('inputSerial').value.trim();
        const qty = parseInt(document.getElementById('inputQty').value);
        const msg = document.getElementById('saveMsg');
        const btn = document.getElementById('btnSubmit');

        if(!name) { alert("กรุณาเลือกชื่อของคุณก่อนส่งข้อมูล"); return; }
        if(!date || !qty) { alert("กรุณากรอกข้อมูลวันที่และจำนวนให้ครบถ้วน"); return; }
        if(!serial) { alert("⚠️ ระบบต้องการ 'หมายเลขครุภัณฑ์' เพื่อระบุประวัติเบิกจ่าย"); return; }

        btn.disabled = true;
        msg.style.display = 'block';
        msg.innerText = "⏳ กำลังส่งข้อมูลไปยังระบบกลาง...";

        fetch(GOOGLE_SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            cache: 'no-cache',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, date, item, qty, serial })
        }).then(() => {
            msg.style.color = 'green';
            msg.innerText = "✅ บันทึกสำเร็จ!";
            document.getElementById('inputSerial').value = '';
            document.getElementById('serialValid').style.display = 'none';
            btn.disabled = false;
            fetchDatabase();
            setTimeout(() => msg.style.display = 'none', 3000);
        }).catch(err => {
            msg.style.color = 'red';
            msg.innerText = "❌ เกิดข้อผิดพลาด";
            btn.disabled = false;
        });
    }

    function loadDashboardOnline() {
        const resultArea = document.getElementById('dashboardResult');
        resultArea.innerHTML = '<p class="loading">🔄 กำลังประมวลผลข้อมูลล่าสุด...</p>';
        
        let grandTotal = historyRecords.reduce((acc, cur) => acc + (parseInt(cur.qty) || 0), 0);
        if(historyRecords.length === 0) {
            resultArea.innerHTML = `<p style="text-align: center; color: #888;">❌ ยังไม่มีข้อมูลการบันทึกในระบบ</p>`;
            return;
        }

        let html = `<h3 style="text-align:center;">ยอดรวมเบิกสะสมทั้งหมด: <span style="color:#005088">${grandTotal} เครื่อง</span></h3>`;
        html += `<h4>📦 รายละเอียดการเบิกรายเครื่องล่าสุด:</h4>`;
        
        historyRecords.forEach(d => {
            html += `
                <div class="stat-item">
                    <div class="stat-name">📅 ${d.date} | 🆔 ครุภัณฑ์: <b>${d.serial}</b> <br> <span style="font-size:13px; color:#666;">${d.item} (โดย ${d.name})</span></div>
                    <div class="stat-value">${d.qty} ชิ้น</div>
                </div>
            `;
        });
        resultArea.innerHTML = html;
    }
</script>
</body>
</html>
